<!DOCTYPE html>
<html>
<head>
<title>Grocery Product Bill</title>

<style>
body{
    background:linear-gradient(to right,#74ebd5,#9face6);
    font-family:Arial,sans-serif;
}

.container{
    width:450px;
    margin:auto;
    margin-top:40px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 8px 20px gray;
}

h1{
    text-align:center;
    color:#1e3a8a;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#2563eb,#06b6d4);
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.02);
}

#result{
    margin-top:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

.total{
    background:#dcfce7;
    color:green;
    font-weight:bold;
}

@media(max-width:600px){
    .container{
        width:90%;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 Grocery Product Bill</h1>

<input type="text" id="pname" placeholder="Product Name">

<input type="number" id="qty" placeholder="Quantity">

<input type="number" id="price" placeholder="Price">

<input type="number" id="tax" placeholder="Tax">

<button onclick="calculate()">Generate Bill</button>

<div id="result"></div>

</div>

<script>
function calculate(){

let pname = document.getElementById("pname").value;
let qty = Number(document.getElementById("qty").value);
let price = Number(document.getElementById("price").value);
let tax = Number(document.getElementById("tax").value);

let subtotal = qty * price;
let total = subtotal + tax;

document.getElementById("result").innerHTML =

"<h2 align='center'>Bill Details</h2>" +

"<table>" +

"<tr><th>Description</th><th>Amount</th></tr>" +

"<tr><td>Product Name</td><td>"+ pname +"</td></tr>" +

"<tr><td>Quantity</td><td>"+ qty +"</td></tr>" +

"<tr><td>Price</td><td>Rs. "+ price +"</td></tr>" +

"<tr><td>Tax</td><td>Rs. "+ tax +"</td></tr>" +

"<tr><td>Subtotal</td><td>Rs. "+ subtotal +"</td></tr>" +

"<tr class='total'><td>Total Amount</td><td>Rs. "+ total +"</td></tr>" +

"</table>";
}
</script>

</body>
</html>
